<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الأمان الصيدلانية</title>
    <style>
        /* ستايل ليلي احترافي ومرتب */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.8); 
        }
        h2 { 
            text-align: center; 
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 15px; 
            margin-bottom: 25px;
            font-size: 1.5em;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 0.9em;
            color: #cccccc;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            background: #2c2c2c; 
            color: white; 
            border: 1px solid #444; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 1em;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ffffff;
        }
        .practical-section { 
            background: #252525; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 20px; 
            border: 1px dashed #555;
        }
        .result-box { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 1.2em; 
            font-weight: bold; 
            background: #333; 
            transition: all 0.3s ease;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #ffffff; 
            color: #000000; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1em; 
            font-weight: bold; 
            margin-top: 25px; 
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { 
            background-color: #dddddd; 
        }
        /* نظام الألوان للإنذار المبكر */
        .danger { background-color: #8b0000 !important; color: white; border: 1px solid #ff4c4c;} 
        .warning { background-color: #b8860b !important; color: white; border: 1px solid #ffd700;} 
        .safe { background-color: #006400 !important; color: white; border: 1px solid #32cd32;} 
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 حاسبة الأمان الصيدلانية</h2>
        
        <label>اسم المادة:</label>
        <input type="text" id="subjectName" placeholder="مثال: علم الأدوية">

        <label>نوع المادة:</label>
        <select id="subjectType" onchange="togglePractical()">
            <option value="both">نظري وعملي</option>
            <option value="theory">نظري فقط</option>
        </select>

        <div id="practicalSection" class="practical-section">
            <label>كويز العملي (من 4):</label>
            <input type="number" id="quiz" value="0" min="0" max="4">
            
            <label>مذاكرة العملي (من 7):</label>
            <input type="number" id="pracMid" value="0" min="0" max="7">
            
            <label>نشاط/دفتر (من 4):</label>
            <input type="number" id="activity" value="0" min="0" max="4">
            
            <label>فاينل العملي (من 15):</label>
            <input type="number" id="pracFinal" value="0" min="0" max="15">
        </div>

        <label>مذاكرة النظري (من 20/40):</label>
        <input type="number" id="theoryMid" value="0" min="0" max="40">

        <button onclick="calculate()">احسب النتيجة ⚡</button>

        <div id="totalResult" class="result-box">المجموع الكلي: -</div>
        <div id="targetResult" class="result-box">درجة الفاينل المطلوبة: -</div>
    </div>

    <script>
        // إخفاء/إظهار قسم العملي بناءً على نوع المادة
        function togglePractical() {
            var type = document.getElementById("subjectType").value;
            var pracSection = document.getElementById("practicalSection");
            if(type === "theory") {
                pracSection.style.display = "none";
            } else {
                pracSection.style.display = "block";
            }
        }

        // البرمجة المنطقية للحسابات ونظام الألوان
        function calculate() {
            var type = document.getElementById("subjectType").value;
            var theoryMid = parseFloat(document.getElementById("theoryMid").value) || 0;
            var total = 0;

            if(type === "both") {
                var q = parseFloat(document.getElementById("quiz").value) || 0;
                var pm = parseFloat(document.getElementById("pracMid").value) || 0;
                var act = parseFloat(document.getElementById("activity").value) || 0;
                var pf = parseFloat(document.getElementById("pracFinal").value) || 0;
                total = q + pm + act + pf + theoryMid;
            } else {
                total = theoryMid;
            }

            var target = 60 - total;
            
            var totalBox = document.getElementById("totalResult");
            var targetBox = document.getElementById("targetResult");

            totalBox.innerText = "المجموع الكلي: " + total;
            targetBox.innerText = "درجة الفاينل المطلوبة للنجاح: " + target;

            // إزالة الألوان القديمة عند كل حسبة جديدة
            totalBox.className = "result-box";
            targetBox.className = "result-box";

            // تلوين المجموع الكلي (أقل من 10 خطر، فوق 30 أمان)
            if(total < 10) totalBox.classList.add("danger");
            else if(total >= 30) totalBox.classList.add("safe");

            // تلوين الفاينل المطلوب
            if(target > 50) targetBox.classList.add("danger"); 
            else if(target >= 40 && target <= 50) targetBox.classList.add("warning"); 
            else if(target < 20) targetBox.classList.add("safe"); 
        }
    </script>
</body>
</html>
